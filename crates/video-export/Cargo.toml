[package]
name = "video-export"
version = "0.1.0"
edition = "2021"
description = "Construction des commandes ffmpeg de la vue Vidéo (ex-LightCutVidz) : filtres, plan d'export, encodeurs."

[lib]
name = "video_export"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scene-core = { path = "../scene-core" }

[dev-dependencies]
tempfile = "3"
