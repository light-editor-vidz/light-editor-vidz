[workspace]
resolver = "2"
members = ["src-tauri", "crates/scene-core", "crates/audio-dsp", "crates/video-export"]

# Le décodage et le rééchantillonnage audio sont inutilisables sans optimisation (un MP3 de
# 5 min met 15 s à se décoder) : les dépendances sont toujours optimisées, même en debug.
[profile.dev.package."*"]
opt-level = 3

# Binaire de release : une seule unité de génération, sans symboles (le binaire de debug fait plus
# de 800 Mo, et sans cela celui de release restait lourd et plus lent).
[profile.release]
# Pas de LTO : il retire de `compiler_builtins` des symboles (`__isPlatformVersionAtLeast`) que
# seul le code Objective-C de ggml-metal et d'onnxruntime appelle, et l'édition de liens macOS échoue.
codegen-units = 1
strip = "symbols"
