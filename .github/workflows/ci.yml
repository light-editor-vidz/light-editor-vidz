name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  web:
    name: Lint and unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
  rust:
    name: Rust tests
    # ort (NLLB translation) links a prebuilt onnxruntime that needs glibc >= 2.38.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev cmake libclang-dev
      - run: npm ci
      - run: npm run fetch:ffmpeg
      - run: npm run build
      - run: cargo test --workspace
        working-directory: src-tauri
        env:
          LIGHT_EDITOR_VIDZ_FFMPEG: ${{ github.workspace }}/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          LIGHT_EDITOR_VIDZ_FFPROBE: ${{ github.workspace }}/src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
