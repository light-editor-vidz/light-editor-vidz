name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/site.yml"]
  # Un tag de version ne publie rien si ces vérifications échouent (voir release.yml).
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Lint and unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src .github
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p tsconfig.test.json
      - run: npm test
      - run: npm audit --omit=dev
      - name: install.sh verifies the checksums
        run: bash scripts/tests/install-verify.test.sh
  rust-lint:
    name: Rust format, clippy and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev cmake libclang-dev
      - run: npm ci
      - run: npm run fetch:ffmpeg
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri
      # Les avertissements « unmaintained » viennent de Tauri/GTK : seules les vulnérabilités échouent.
      - run: cargo install cargo-audit --locked --version 0.21.2 && cargo audit
  rust-macos:
    name: Rust tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - run: npm run fetch:ffmpeg
      - run: npm run build
      - run: cargo test --workspace
        working-directory: src-tauri
        env:
          LIGHT_EDITOR_VIDZ_FFMPEG: ${{ github.workspace }}/src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          LIGHT_EDITOR_VIDZ_FFPROBE: ${{ github.workspace }}/src-tauri/binaries/ffprobe-aarch64-apple-darwin
  rust:
    name: Rust tests
    # ort (NLLB translation) links a prebuilt onnxruntime that needs glibc >= 2.38.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev cmake libclang-dev
      - run: npm ci
      - run: npm run fetch:ffmpeg
      - run: npm run build
      - run: cargo test --workspace
        working-directory: src-tauri
        env:
          LIGHT_EDITOR_VIDZ_FFMPEG: ${{ github.workspace }}/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          LIGHT_EDITOR_VIDZ_FFPROBE: ${{ github.workspace }}/src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
