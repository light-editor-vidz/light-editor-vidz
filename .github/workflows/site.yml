name: Site

# Builds the website in site/ and publishes it with GitHub Pages
# (https://light-editor-vidz.github.io/light-editor-vidz/).
on:
  push:
    branches: [main]
    paths: ["site/**", "install.sh", "uninstall.sh", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Builds the site, then checks pages, links, FR/EN texts and the install scripts.
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
