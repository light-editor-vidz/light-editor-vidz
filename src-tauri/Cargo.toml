[package]
name = "light-editor-vidz"
version = "1.0.2"
description = "Light video editor: compose scenes, text, images and video, export to MP4"
authors = ["Sikander RAVATE <r.sik@hotmail.fr>"]
license = "MIT"
repository = "https://github.com/light-editor-vidz/light-editor-vidz"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "light_editor_vidz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scene-core = { path = "../crates/scene-core" }
audio-dsp = { path = "../crates/audio-dsp" }
video-export = { path = "../crates/video-export" }
anyhow = "1"
# Vue Image (ex-LightCutImgz)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "rayon"] }
imageproc = { version = "0.25", default-features = false, features = ["rayon"] }
base64 = "0.23"
rayon = "1"
uuid = { version = "1", features = ["v4"] }
kamadak-exif = "0.6"
img-parts = "0.4"
# Génération de sous-titres (ex-LightGenSubz)
whisper-rs = "0.16"
sha2 = "0.11"
futures-util = "0.3"
hound = "3"
dirs = "7"
ort = "=2.0.0-rc.15"
tokenizers = "0.23"
zeroize = "1"
tempfile = "3"
# Le trousseau de sous-titres est en v4 ; celui des clés d'assets reste en v3.
keyring4 = { package = "keyring", version = "4" }
# Recherche/téléchargement d'assets libres de droit (Pexels, Pixabay, Freesound, Openverse).
# rustls plutôt qu'openssl : pas de dépendance système supplémentaire au build.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "blocking", "multipart", "query", "form"] }
futures = "0.3"
# Écriture asynchrone des téléchargements (déjà une dépendance transitive de reqwest/tauri).
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

# Sans Metal, whisper.cpp ne tourne que sur le CPU, même sur Apple Silicon.
[target.'cfg(target_os = "macos")'.dependencies.whisper-rs]
version = "0.16"
features = ["metal"]
